<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data Collector &amp; Briefing Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 상단 헤더 -->
        <header class="header">
            <h1>Stock Data Collector &amp; Briefing Tool</h1>
            <p class="subtitle">6자리 종목코드를 입력하면 네이버 증권 지표와 최신 뉴스를 한눈에 정리해 드립니다.</p>
        </header>

        <!-- 검색창 구역 -->
        <section class="search-section">
            <form id="search-form" class="search-form">
                <input
                    type="text"
                    id="stock-code-input"
                    name="code"
                    maxlength="6"
                    placeholder="6자리 종목코드 입력 (예: 000660)"
                    autocomplete="off"
                    required
                >
                <button type="submit" id="search-btn">수집 시작</button>
            </form>
            <div class="quick-examples">
                <span>예시 종목:</span>
                <button type="button" class="example-btn" data-code="000660">000660 (SK하이닉스)</button>
                <button type="button" class="example-btn" data-code="005930">005930 (삼성전자)</button>
                <button type="button" class="example-btn" data-code="035420">035420 (NAVER)</button>
            </div>
        </section>

        <!-- 로딩 및 오류 안내 구역 -->
        <div id="loading-box" class="loading-box hidden">
            데이터를 수집하고 있습니다. 잠시만 기다려 주세요...
        </div>

        <div id="error-box" class="error-box hidden" role="alert">
            <!-- 오류 메시지가 동적으로 표시됩니다 -->
        </div>

        <!-- 수집 결과 메인 구역 -->
        <main id="result-section" class="result-section hidden">
            <!-- 1. 스냅샷 카드 구역 -->
            <section class="card snapshot-card">
                <div class="stock-header">
                    <div>
                        <span id="stock-code" class="stock-code-badge">000000</span>
                        <h2 id="stock-name" class="stock-name">종목명</h2>
                    </div>
                    <div class="price-box">
                        <div id="current-price" class="current-price">-</div>
                        <div id="change-rate" class="change-rate">-</div>
                    </div>
                </div>

                <div class="metrics-grid">
                    <div class="metric-item">
                        <span class="metric-label">시가총액</span>
                        <span id="market-cap" class="metric-value">-</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">PER</span>
                        <span id="per" class="metric-value">-</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">추정 PER</span>
                        <span id="cns-per" class="metric-value">-</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">PBR</span>
                        <span id="pbr" class="metric-value">-</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">EPS</span>
                        <span id="eps" class="metric-value">-</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">BPS</span>
                        <span id="bps" class="metric-value">-</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">배당수익률</span>
                        <span id="dividend-yield" class="metric-value">-</span>
                    </div>
                </div>
            </section>

            <!-- 2. 기업실적분석 표 구역 -->
            <section class="card financials-card">
                <div class="section-title-row">
                    <h3>연간 기업실적분석</h3>
                    <span class="unit-note">(단위: 억원 / ROE: %)</span>
                </div>
                <div class="table-wrapper">
                    <table class="financials-table">
                        <thead>
                            <tr>
                                <th>기간</th>
                                <th>매출액</th>
                                <th>영업이익</th>
                                <th>ROE</th>
                            </tr>
                        </thead>
                        <tbody id="financials-tbody">
                            <!-- 실적 데이터가 동적으로 렌더링됩니다 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 3. 최신 뉴스 리스트 구역 -->
            <section class="card news-card">
                <h3>최신 관련 뉴스 (5건)</h3>
                <ul id="news-list" class="news-list">
                    <!-- 뉴스 목록이 동적으로 렌더링됩니다 -->
                </ul>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
